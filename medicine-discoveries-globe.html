(function(){
"use strict";
D.forEach(function(x,i){x.i=i;});
var on={};Object.keys(TOPICS).forEach(function(k){on[k]=true;});
var KN=[[0,-500],[150,1500],[330,1800],[540,1900],[700,1950],[1000,2025]];
function s2y(v){for(var i=1;i<KN.length;i++)if(v<=KN[i][0]){var a=KN[i-1],b=KN[i];return a[1]+(v-a[0])/(b[0]-a[0])*(b[1]-a[1]);}return 2025;}
function y2s(y){for(var i=1;i<KN.length;i++)if(y<=KN[i][1]){var a=KN[i-1],b=KN[i];return a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]);}return 1000;}
var maxY=2025,view="globe",cur=null,shown={},world=null;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function vis(){return D.filter(function(x){return on[x.c]&&x.n<=maxY;});}

function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show");},2200);}

/* chips */
var chips=$("chips"),h='<button class="chip all" data-t="*"><span class="dot"></span>הכול</button>';
Object.keys(TOPICS).forEach(function(k){h+='<button class="chip" style="--c:'+TOPICS[k][1]+'" data-t="'+k+'" aria-pressed="true"><span class="dot"></span>'+TOPICS[k][0]+'</button>';});
chips.innerHTML=h;
chips.addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;var t=b.dataset.t;
  var K=Object.keys(on),all=K.every(function(k){return on[k];});
  if(t==="*")K.forEach(function(k){on[k]=true;});
  else if(all)K.forEach(function(k){on[k]=k===t;});
  else{on[t]=!on[t];if(!K.some(function(k){return on[k];}))K.forEach(function(k){on[k]=true;});}
  chips.querySelectorAll(".chip[data-t]").forEach(function(c){if(c.dataset.t==="*")return;c.classList.toggle("off",!on[c.dataset.t]);c.setAttribute("aria-pressed",on[c.dataset.t]);});
  refresh();});

/* clustering */
function clusters(list){var out=[],used={};var th=4.5;
  list.forEach(function(a){if(used[a.i])return;var g=[a];used[a.i]=1;
    list.forEach(function(b){if(used[b.i])return;if(Math.abs(a.la-b.la)<th&&Math.abs(a.lo-b.lo)<th){g.push(b);used[b.i]=1;}});
    var la=g.reduce(function(s,x){return s+x.la;},0)/g.length,lo=g.reduce(function(s,x){return s+x.lo;},0)/g.length;
    out.push({lat:la,lng:lo,g:g.sort(function(x,y){return x.n-y.n;})});});
  return out;}
function pinEl(c){var el=document.createElement("div");el.className="pw";var p=document.createElement("div");
  if(c.g.length===1){var x=c.g[0];p.className="pin"+(shown[x.i]?"":" new");p.style.setProperty("--c",TOPICS[x.c][1]);p.textContent=x.e;p.title=x.y+" · "+x.t;p.setAttribute("aria-label",x.y+" "+x.t);p.onclick=function(){openCard(x.i);};}
  else{p.className="pin cluster";p.dataset.e=c.g[0].e;p.textContent=c.g.length;p.title=c.g.map(function(x){return x.y+" "+x.t;}).join("\n");p.setAttribute("aria-label",c.g.length+" תגליות באזור");p.onclick=function(){openPick(c.g);};}
  p.setAttribute("role","button");p.tabIndex=0;p.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();p.click();}};
  c.g.forEach(function(x){shown[x.i]=1;});el.appendChild(p);return el;}

function refresh(){
  var v=vis();$("count").textContent=v.length+" מתוך "+D.length+" תגליות";$("yr").textContent=yLabel(maxY);
  if(world)world.htmlElementsData(clusters(v));
  if(view==="list")renderList(v);
}
function renderList(v){var L=$("list");v=v.slice().sort(function(a,b){return a.n-b.n;});
  L.innerHTML=v.length?v.map(function(x){var yy=x.y.split(" (")[0];return '<li><button class="li" style="--c:'+TOPICS[x.c][1]+'" data-i="'+x.i+'"><span class="yr">'+esc(yy)+'</span><span class="em">'+x.e+'</span><span><span class="nm">'+esc(x.t)+'</span><span class="pl">'+esc(x.w)+' · '+esc(x.pl)+'</span></span></button></li>';}).join(""):'<li class="empty">אין תגליות בטווח הזה. הזיזו את ציר הזמן או בחרו נושאים נוספים.</li>';}
$("list").addEventListener("click",function(e){var b=e.target.closest(".li");if(b)openCard(+b.dataset.i);});

/* card */
function closeCard(){$("sheet").hidden=true;document.body.classList.remove("sheet-open");cur=null;}
function openPick(g){var s=$("sheetIn");s.innerHTML='<button class="close" aria-label="סגירה">✕</button><h3>'+g.length+' תגליות באזור הזה</h3><ul class="pick">'+g.map(function(x){return '<li><button class="li" style="--c:'+TOPICS[x.c][1]+'" data-i="'+x.i+'"><span class="yr">'+esc(x.y.split(" (")[0])+'</span><span class="em">'+x.e+'</span><span><span class="nm">'+esc(x.t)+'</span><span class="pl">'+esc(x.w)+'</span></span></button></li>';}).join("")+'</ul>';
  $("sheet").hidden=false;document.body.classList.add("sheet-open");if(world)world.pointOfView({lat:g[0].la,lng:g[0].lo,altitude:1.2},800);}
function openCard(i){var x=D[i];cur=i;var c=TOPICS[x.c];
  var ord=vis().sort(function(a,b){return a.n-b.n;}),k=ord.indexOf(x);
  $("sheetIn").innerHTML='<button class="close" aria-label="סגירה">✕</button><div class="c-top" style="--c:'+c[1]+'"><div class="c-em" style="--c:'+c[1]+'">'+x.e+'</div><div><h2>'+esc(x.t)+'</h2><span class="who">'+esc(x.w)+' <span class="orig">'+esc(x.o)+'</span></span></div></div>'+
   '<div class="meta"><span class="tag">📅 '+esc(x.y)+'</span><span class="tag">📍 '+esc(x.pl)+'</span><span class="tag t" style="--c:'+c[1]+'">'+c[0]+'</span></div>'+
   '<p class="d">'+esc(x.d)+'</p><div class="box why"><b>💡 למה זה חשוב?</b>'+esc(x.why)+'</div><div class="box q"><b>🗣️ שאלה לכיתה</b>'+esc(x.q)+'</div>'+
   '<div class="c-foot"><span>'+(k>=0?(k+1)+" מתוך "+ord.length:"")+'</span><div class="nav2"><button data-nav="-1"'+(k<=0?" disabled":"")+'>→ הקודמת</button><button data-nav="1"'+(k<0||k>=ord.length-1?" disabled":"")+'>הבאה ←</button></div></div>';
  $("sheet").hidden=false;document.body.classList.add("sheet-open");$("sheetIn").scrollTop=0;
  if(world&&view==="globe")world.pointOfView({lat:x.la,lng:x.lo,altitude:1.5},900);}
$("sheet").addEventListener("click",function(e){
  if(e.target.closest(".close"))return closeCard();
  var b=e.target.closest(".li");if(b)return openCard(+b.dataset.i);
  var n=e.target.closest("[data-nav]");if(n&&cur!=null){var ord=vis().sort(function(a,b){return a.n-b.n;}),k=ord.indexOf(D[cur])+ +n.dataset.nav;if(ord[k])openCard(ord[k].i);}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCard();});

/* view switch */
function setView(v){view=v;$("vGlobe").classList.toggle("on",v==="globe");$("vList").classList.toggle("on",v==="list");$("vGlobe").setAttribute("aria-selected",v==="globe");$("vList").setAttribute("aria-selected",v==="list");
  $("globeWrap").hidden=v!=="globe";$("listWrap").hidden=v!=="list";refresh();if(v==="globe")sizeGlobe();}
$("vGlobe").onclick=function(){setView("globe");};$("vList").onclick=function(){setView("list");};
$("rand").onclick=function(){var v=vis();if(!v.length)return;var x=v[Math.floor(Math.random()*v.length)];toast("🎲 "+x.t);openCard(x.i);};

/* timeline */
var sl=$("slider");
sl.addEventListener("input",function(){maxY=s2y(+sl.value);refresh();});
var playT=null;
$("play").onclick=function(){var b=$("play");
  if(playT){clearInterval(playT);playT=null;b.classList.remove("on");b.textContent="▶";return;}
  closeCard();if(+sl.value>=1000)sl.value=0;b.classList.add("on");b.textContent="⏸";var last=vis().length;
  playT=setInterval(function(){var v=Math.min(1000,+sl.value+6);sl.value=v;maxY=s2y(v);refresh();var now=vis();
    if(now.length>last){var nw=now.filter(function(x){return x.n<=maxY;}).sort(function(a,b){return b.n-a.n;})[0];toast(nw.y.split(" (")[0]+" · "+nw.t);if(world)world.pointOfView({lat:nw.la,lng:nw.lo,altitude:2},700);}
    last=now.length;if(v>=1000){clearInterval(playT);playT=null;b.classList.remove("on");b.textContent="▶";}},90);};

/* globe */
function sizeGlobe(){if(!world)return;var w=$("globeWrap");world.width(w.clientWidth).height(w.clientHeight);}

  try{
    world=Globe()($("globe")).globeImageUrl("globe/earth-day.jpg").backgroundColor("rgba(0,0,0,0)").showAtmosphere(true).atmosphereColor("#8ecfd6")

  }catch(err){$("loading").textContent="הגלובוס לא נטען בדפדפן הזה. אפשר לעבור לציר הזמן 📋";setView("list");}
}

})();
