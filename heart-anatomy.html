<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אנטומיה של הלב — דף עבודה אינטראקטיבי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f6f3f2; --card:#ffffff; --ink:#22191a; --muted:#6b5c5d; --line:#e6dcdb;
  --accent:#b8323f; --accent-soft:#f8e4e6; --vein:#3b5ba9; --ok:#2f8a57; --ok-soft:#e3f3ea; --bad:#c0392b; --bad-soft:#fbe6e3;
  --f-d:"Rubik","Assistant",system-ui,sans-serif; --f-b:"Assistant","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171213; --card:#221b1c; --ink:#f1e8e8; --muted:#b5a3a4; --line:#3a2f30;
  --accent:#e2626f; --accent-soft:#3b2226; --vein:#8aa4ea; --ok:#5fbf86; --ok-soft:#1d3327; --bad:#ef7a6c; --bad-soft:#3d221f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1,h2{font-family:var(--f-d);margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.15rem}
.lead{color:var(--muted);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.top{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
label.name{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%}
#name{min-width:220px}
.score{font-family:var(--f-d);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px;min-width:200px}
.bar span{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.diagram{position:relative;max-width:560px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden}
.diagram img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:9%;max-width:44px;aspect-ratio:1;border-radius:50%;border:0;background:var(--accent);color:#fff;font-family:var(--f-d);font-weight:700;font-size:clamp(.75rem,2.6vw,1.05rem);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;padding:0}
.pin.ok{background:var(--ok)}
.pin.sel{outline:3px solid #ffd54a;outline-offset:2px}
.hint{color:var(--muted);font-size:.9rem;text-align:center;margin-top:8px}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.row{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;scroll-margin-top:16px;transition:box-shadow .2s}
.row.flash{box-shadow:0 0 0 3px #ffd54a}
.num{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-d);font-weight:700}
.row.done .num{background:var(--ok)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.fields .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:.8rem;color:var(--muted);font-weight:600}
.fb{font-size:.85rem;min-height:1.2em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-soft)}
select.bad,input.bad{border-color:var(--bad);background:var(--bad-soft)}
input[dir=ltr]{text-align:left}
textarea{min-height:64px;resize:vertical}
.btn{border:0;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.btn.main{background:var(--accent);color:#fff}
.model{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:.92rem;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-inline-end:4px}
.saved{font-size:.8rem;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000;font-size:12pt}.card{border:1px solid #999;break-inside:avoid}.actions,.btn,.hint{display:none!important}
  .row{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <h1>🫀 אנטומיה של הלב</h1>
  <p class="lead">לפניכם תרשים של הלב ושל כלי הדם הגדולים המחוברים אליו. לכל מספר בתרשים: בחרו את שם המרכיב בעברית, כתבו את שמו בלועזית (אנגלית), והסבירו מה תפקידו. התשובות נשמרות לבד בטלפון.</p>

 {n:9,x:232,y:378,he:"מסתם עורק הריאה",la:"Pulmonary valve",alt:["pulmonary valve","pulmonic valve","pulmonary semilunar valve","semilunar valve"],fn:"מסתם למחצה ירחי בין החדר הימני לעורק הריאה. נפתח כשהחדר מתכווץ, ונסגר כדי למנוע זרימה חוזרת של דם אל החדר."},
 {n:10,x:108,y:375,he:"וריד נבוב תחתון",la:"Inferior vena cava",alt:["inferior vena cava","ivc","vena cava inferior"],fn:"מחזיר דם דל בחמצן מפלג הגוף התחתון (בטן ורגליים) אל העלייה הימנית."},
 {n:11,x:71,y:309,he:"חדר ימני",la:"Right ventricle",alt:["right ventricle"],fn:"מקבל דם דל בחמצן מהעלייה הימנית ודוחף אותו לעורק הריאה ולריאות. הדופן שלו דקה יותר משל החדר השמאלי, כי הריאות קרובות."},
 {n:12,x:52,y:215,he:"מסתם תלת־צניפי",la:"Tricuspid valve",alt:["tricuspid valve","tricuspid"],fn:"מסתם בין העלייה הימנית לחדר הימני. מאפשר זרימה מהעלייה לחדר ומונע זרימה חוזרת לעלייה כשהחדר מתכווץ."},
 {n:13,x:58,y:139,he:"ורידי הריאה",la:"Pulmonary veins",alt:["pulmonary veins","pulmonary vein","right pulmonary veins"],fn:"מחזירים דם עשיר בחמצן מהריאה הימנית אל העלייה השמאלית."},
 {n:14,x:51,y:75,he:"עלייה ימנית",la:"Right atrium",alt:["right atrium"],fn:"קולטת דם דל בחמצן מהגוף דרך שני הוורידים הנבובים, ומעבירה אותו לחדר הימני. בדופן שלה נמצא קוצב הלב הטבעי (הצומת הסינוסי, SA)."}
];
var W=493,H=410;
var NAMES=[];PARTS.forEach(function(p){if(NAMES.indexOf(p.he)<0)NAMES.push(p.he);});
NAMES.sort(function(a,b){return a.localeCompare(b,"he");});

var st={name:"",he:{},la:{},fn:{},show:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==="object")st=Object.assign(st,o);}}catch(e){}
var saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(st));document.getElementById("saved").textContent="✔ נשמר";}catch(e){document.getElementById("saved").textContent="לא ניתן לשמור בדפדפן הזה";}},400);}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* pins */
var dg=document.getElementById("diagram");
PARTS.forEach(function(p){
  var b=document.createElement("button");b.className="pin";b.id="pin"+p.n;b.textContent=p.n;
  b.style.left=(p.x/W*100)+"%";b.style.top=(p.y/H*100)+"%";b.setAttribute("aria-label","מרכיב מספר "+p.n);
  b.addEventListener("click",function(){var r=document.getElementById("row"+p.n);r.scrollIntoView({behavior:"smooth",block:"center"});r.classList.add("flash");setTimeout(function(){r.classList.remove("flash");},1400);var s=r.querySelector("select");if(s)s.focus({preventScroll:true});});
  dg.appendChild(b);
});

/* rows */
var rows=document.getElementById("rows"),h="";
PARTS.forEach(function(p){
  h+='<div class="row" id="row'+p.n+'"><div class="num">'+p.n+'</div><div class="fields">'+
  '<label class="f"><span>שם המרכיב בעברית</span><select id="he'+p.n+'" data-n="'+p.n+'"><option value="">בחרו…</option>'+NAMES.map(function(x){return '<option>'+esc(x)+'</option>';}).join("")+'</select><div class="fb" id="hefb'+p.n+'"></div></label>'+
  '<label class="f"><span>שם המרכיב בלועזית</span><input type="text" dir="ltr" id="la'+p.n+'" data-n="'+p.n+'" placeholder="e.g. Right atrium" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb" id="lafb'+p.n+'"></div></label>'+
  '<label class="f full"><span>תפקיד המרכיב</span><textarea id="fn'+p.n+'" data-n="'+p.n+'" placeholder="מה התפקיד שלו? לאן הוא מוביל דם, ואיזה דם?"></textarea></label>'+
  '<div class="full"><button class="btn" data-show="'+p.n+'">הצגת תשובה מוצעת</button><div class="model" id="model'+p.n+'" hidden></div></div>'+
  '</div></div>';
});
rows.innerHTML=h;

function evalRow(p){
  var s=document.getElementById("he"+p.n),v=st.he[p.n]||"",fb=document.getElementById("hefb"+p.n);
  s.value=v;s.className="";fb.className="fb";fb.textContent="";
  var ok=v===p.he;
  if(v){s.className=ok?"ok":"bad";fb.className="fb "+(ok?"ok":"bad");fb.textContent=ok?"✓ נכון!":"✗ לא מדויק. הסתכלו שוב על הקו בתרשים.";}
  document.getElementById("row"+p.n).classList.toggle("done",ok);
  document.getElementById("pin"+p.n).classList.toggle("ok",ok);
  var li=document.getElementById("la"+p.n),lv=st.la[p.n]||"",lfb=document.getElementById("lafb"+p.n);
  li.value=lv;li.className="";lfb.className="fb";lfb.textContent="";
  if(norm(lv).length>2){var lok=p.alt.indexOf(norm(lv))>=0;li.className=lok?"ok":"bad";lfb.className="fb "+(lok?"ok":"bad");lfb.textContent=lok?"✓ נכון!":"בדקו את האיות";}
  document.getElementById("fn"+p.n).value=st.fn[p.n]||"";
  var m=document.getElementById("model"+p.n),btn=rows.querySelector('[data-show="'+p.n+'"]');
  m.hidden=!st.show[p.n];btn.textContent=st.show[p.n]?"הסתרת התשובה המוצעת":"הצגת תשובה מוצעת";
  m.innerHTML='<b>'+esc(p.he)+'</b> · <span dir="ltr">'+esc(p.la)+'</span><br>'+esc(p.fn);
  return ok;
}
function score(){
  var c=PARTS.filter(function(p){return st.he[p.n]===p.he;}).length;
  document.getElementById("score").textContent=c+" / 14 שמות נכונים"+(c===14?" 🎉":"");
  document.getElementById("barfill").style.width=(c/14*100)+"%";
}
function all(){PARTS.forEach(evalRow);score();}
document.getElementById("name").value=st.name||"";
all();

document.addEventListener("change",function(e){var t=e.target;if(t.tagName==="SELECT"&&t.id.indexOf("he")===0){var n=+t.dataset.n;st.he[n]=t.value;evalRow(PARTS[n-1]);score();save();}});
document.addEventListener("input",function(e){var t=e.target,n=+t.dataset.n;
  if(t.id==="name"){st.name=t.value;save();return;}
  if(t.id.indexOf("fn")===0){st.fn[n]=t.value;save();}
  if(t.id.indexOf("la")===0){st.la[n]=t.value;save();}
});
document.addEventListener("focusout",function(e){var t=e.target;if(t.id&&t.id.indexOf("la")===0&&t.dataset.n){evalRow(PARTS[+t.dataset.n-1]);}});
rows.addEventListener("click",function(e){var b=e.target.closest("[data-show]");if(!b)return;e.preventDefault();var n=+b.dataset.show;st.show[n]=!st.show[n];evalRow(PARTS[n-1]);save();});
document.getElementById("showAll").addEventListener("click",function(){var any=PARTS.some(function(p){return !st.show[p.n];});PARTS.forEach(function(p){st.show[p.n]=any;});all();save();this.textContent=any?"הסתרת כל התשובות המוצעות":"הצגת כל התשובות המוצעות";});
var resetBtn=document.getElementById("reset");
resetBtn.addEventListener("click",function(){
  if(!resetBtn.dataset.sure){resetBtn.dataset.sure="1";resetBtn.textContent="בטוח? לחצו שוב למחיקת התשובות";setTimeout(function(){delete resetBtn.dataset.sure;resetBtn.textContent="איפוס הדף";},3500);return;}
  st={name:st.name,he:{},la:{},fn:{},show:{}};all();save();delete resetBtn.dataset.sure;resetBtn.textContent="איפוס הדף";window.scrollTo(0,0);
});
document.getElementById("printBtn").addEventListener("click",function(){window.print();});
})();
</script>
</body>
</html>
