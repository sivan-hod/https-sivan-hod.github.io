function s3(){var c=CASES[cur.order[cur.k]];if(!c)return finish(2);
  var h=panel(2,(cur.k+1)+" / "+CASES.length,"אבחנה נכונה בניסיון ראשון = 2 נק׳, שאלת ההמשך = נקודה.");
  h+='<div class="story"><div class="who">'+esc(c.who)+'</div>'+esc(c.s)+'</div><table class="labs"><tbody>'+c.labs.map(function(l){var tg=l[3]==="lo"?'<span class="tag lo">נמוך ↓</span>':l[3]==="hi"?'<span class="tag hi">גבוה ↑</span>':l[3]==="n"?'<span class="tag n">תקין</span>':"";return '<tr><td>'+esc(l[0])+'</td><td><span class="v" dir="ltr">'+esc(l[1])+'</span>'+tg+(l[2]?'<div class="rng">טווח תקין: <bdi dir="ltr">'+esc(l[2])+'</bdi></div>':'')+'</td></tr>';}).join("")+'</tbody></table>';
  h+='<p class="q">מה האבחנה?</p>'+typeBtns(cur.dxo)+'<div id="fb"></div><div id="fq"></div></div>';app.innerHTML=h;}

/* station 4 */
function s4(){var q=TF[cur.order[cur.k]];if(!q)return finish(3);
  var h=panel(3,(cur.k+1)+" / "+TF.length,"");
  h+='<div class="card">'+esc(q[0])+'</div><div class="tf"><button class="opt" data-tf="1">✅ נכון</button><button class="opt" data-tf="0">❌ לא נכון</button></div><div id="fb"></div></div>';app.innerHTML=h;}

function start(i){cur={i:i,k:0,pts:0};st.pts[i]=st.pts[i]||0;
  if(i===0){cur.order=shuf(RIDDLES.map(function(_,j){return j;}));cur.open=1;cur.wrong=[];}
  if(i===1)cur.order=shuf(CARDS.map(function(_,j){return j;}));
  if(i===2){cur.order=shuf(CASES.map(function(_,j){return j;}));prepCase();}
  if(i===3)cur.order=shuf(TF.map(function(_,j){return j;}));
  cur.pts=0;render();window.scrollTo(0,0);}
function prepCase(){var c=CASES[cur.order[cur.k]];if(c){cur.dxo=shuf(c.o);cur.qo=shuf(c.qo.map(function(_,j){return j;}));cur.tries=0;}}
function render(){[s1,s2,s3,s4][cur.i]();}
function summary(){cur=null;var h='<button class="back" data-go="home">→ חזרה לתחנות</button><div class="panel"><div class="ptitle"><h2>📋 טבלת סיכום</h2><span class="prog">7 סוגי אנמיה</span></div><div style="overflow-x:auto"><table class="sumt"><thead><tr><th>סוג</th><th>קבוצה</th><th>MCV</th><th>סיבות</th><th>סימן מיוחד / בדיקה</th><th>טיפול</th></tr></thead><tbody>';
  SUM.forEach(function(r){h+='<tr><td>'+T[r[0]].n+'</td><td data-h="קבוצה">'+T[r[0]].g+'</td><td data-h="MCV">'+r[1]+'</td><td data-h="סיבות">'+r[2]+'</td><td data-h="סימן מיוחד">'+r[3]+'</td><td data-h="טיפול">'+r[4]+'</td></tr>';});
  h+='</tbody></table></div></div>';app.innerHTML=h;window.scrollTo(0,0);}

document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){var v=g.dataset.go;
    if(v==="home")return home();
    if(v==="sum")return summary();
    if(v==="reset"){if(g.dataset.sure){st={pts:{},done:{}};save();showScore();return home();}g.dataset.sure=1;g.textContent="לחצו שוב לאישור";return;}
    if(v==="clue"){cur.open++;return s1();}
    if(v==="next"){cur.k++;if(cur.i===0){cur.open=1;cur.wrong=[];cur.over=false;cur.got=0;}if(cur.i===2)prepCase();render();window.scrollTo(0,0);return;}
    return start(+v);
  }
  var b=e.target.closest(".opt");if(!b||b.disabled||!cur)return;
  if(cur.i===0){var r=RIDDLES[cur.order[cur.k]];
    if(b.dataset.t===r.a){cur.got=Math.max(1,5-cur.open);add(0,cur.got);cur.over=true;s1();}
    else{cur.wrong.push(b.dataset.t);b.classList.add("wrong");b.disabled=true;if(cur.open<4){cur.open++;s1();}else{cur.got=0;cur.over=true;s1();}}
  }
  else if(cur.i===1){var c=CARDS[cur.order[cur.k]];var ok=b.dataset.t===c[1];
    if(!ok&&!cur.miss){cur.miss=1;b.classList.add("wrong");b.disabled=true;document.getElementById("fb").innerHTML='<div class="fb no"><strong>לא בדיוק. נסו שוב 🙂</strong></div>';return;}
    if(ok&&!cur.miss)add(1,1);
    app.querySelectorAll(".opt").forEach(function(x){x.disabled=true;if(x.dataset.t===c[1])x.classList.add("right");else if(!x.classList.contains("wrong"))x.classList.add("dim");});
    document.getElementById("fb").innerHTML='<div class="fb '+(cur.miss?"no":"ok")+'"><strong>'+(cur.miss?(ok?"✓ נכון, בניסיון השני":"התשובה: "+T[c[1]].n):"✓ נכון! +1")+'</strong>'+esc(c[2])+'</div><div class="row"><button class="btn" data-go="next">הבא ←</button></div>';
    cur.miss=0;
  }
  else if(cur.i===2){var cs=CASES[cur.order[cur.k]];
    if(b.dataset.t){var okd=b.dataset.t===cs.a;cur.tries++;
      if(!okd&&cur.tries<2){b.classList.add("wrong");b.disabled=true;document.getElementById("fb").innerHTML='<div class="fb no"><strong>לא זו. הסתכלו שוב על הבדיקות ונסו שוב.</strong></div>';return;}
      if(okd&&cur.tries===1)add(2,2);
      app.querySelectorAll(".opt[data-t]").forEach(function(x){x.disabled=true;if(x.dataset.t===cs.a)x.classList.add("right");else if(!x.classList.contains("wrong"))x.classList.add("dim");});
      document.getElementById("fb").innerHTML='<div class="fb '+(okd&&cur.tries===1?"ok":"no")+'"><strong>'+(okd?(cur.tries===1?"✓ אבחנה נכונה! +2":"✓ נכון, בניסיון השני"):"האבחנה: "+T[cs.a].n)+'</strong></div>';
      document.getElementById("fq").innerHTML='<p class="q">'+esc(cs.q)+'</p><div class="opts">'+cur.qo.map(function(j){return '<button class="opt" data-q="'+j+'">'+esc(cs.qo[j])+'</button>';}).join("")+'</div><div id="fb2"></div>';
    } else if(b.dataset.q!=null){var okq=+b.dataset.q===cs.qa;if(okq)add(2,1);
      app.querySelectorAll(".opt[data-q]").forEach(function(x){x.disabled=true;if(+x.dataset.q===cs.qa)x.classList.add("right");else if(x===b)x.classList.add("wrong");else x.classList.add("dim");});
      document.getElementById("fb2").innerHTML='<div class="fb '+(okq?"ok":"no")+'"><strong>'+(okq?"✓ נכון! +1":"לא בדיוק")+'</strong>'+esc(cs.ex)+'</div><div class="row"><button class="btn" data-go="next">המקרה הבא ←</button></div>';}
  }
  else if(cur.i===3){var q=TF[cur.order[cur.k]],ans=b.dataset.tf==="1",ok4=ans===q[1];if(ok4)add(3,1);
    app.querySelectorAll(".opt").forEach(function(x){x.disabled=true;var v=x.dataset.tf==="1";if(v===q[1])x.classList.add("right");else if(x===b)x.classList.add("wrong");else x.classList.add("dim");});
    document.getElementById("fb").innerHTML='<div class="fb '+(ok4?"ok":"no")+'"><strong>'+(ok4?"✓ נכון! +1":"✗ לא נכון. התשובה: "+(q[1]?"נכון":"לא נכון"))+'</strong>'+esc(q[2])+'</div><div class="row"><button class="btn" data-go="next">הבא ←</button></div>';}
});
document.getElementById("home-link").addEventListener("click",home);
showScore();home();
})();

</script></body></html>
